<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina content</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="login-container">
         <div class="login-box">
         <h2 class="logo">Lumina</h2>
                    <h1>Welcome back!</h1>

        <p class="subtitle">
                Pick up where you left off, and keep things moving.
            </p>
            <form>

                <input 
                    type="email" 
                    placeholder="john.doe@gmail.com"
                >
                <div class="password-box">
                    <input type="password" 
                        placeholder="********"
                    >
                     <span>Show</span>
    </div>
    <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit">
                     Log in →
                </button>

            </form>
            <div class="or">
                <span>or</span>
            </div>

            <button class="google-btn">
                Continue with Google
            </button>

            <p class="signup">
                Don't have an Account?
                <a href="#">Sign up</a>
            </p>

        </div>
        <div class="image-box">
<img src="https://tse4.mm.bing.net/th/id/OIP.CA_o5LoZLhNn_IXSO77mZQHaNL?r=0&pid=Api&P=0&h=180" alt="">
</div>
            
</body>
</html>
